name: Verify live CRM intake once
on:
  pull_request:
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-public-intake-once.cjs
