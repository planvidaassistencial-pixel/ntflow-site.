name: Validate NT Flow sales page
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/lead-capture.js
      - run: node scripts/test-site-leads.cjs
      - run: node scripts/smoke-live-leads.cjs
